<!DOCTYPE html>
<html>
<head>
<title>Student Registration Form</title>
</head>

<body>

<h1>Student Registration Form</h1>

<form>

<label for="fullname">Full Name:</label>
<input type="text" id="fullname" name="fullname" placeholder="First name Middle Initial Last name" required minlength="2" maxlength="50">
<br><br>

<label for="studentid">Student ID:</label>
<input type="text" id="studentid" name="studentid" placeholder="00-0000-000" required>
<br><br>

<label for="email">Email:</label>
<input type="email" id="email" name="email" placeholder="you@example.com" required>
<br><br>

<label for="password">Password:</label>
<input type="password" id="password" name="password" placeholder="Must be 8 characters long" required minlength="8" maxlength="20">
<br><br>

<label for="birthday">Birthday:</label>
<input type="date" id="birthday" name="birthday" required>
<br><br>

<label>Gender:</label>
<input type="radio" id="male" name="gender" value="male">
<label for="male">Male</label>
<input type="radio" id="female" name="gender" value="female">
<label for="female">Female</label>
<input type="radio" id="other" name="gender" value="other">
<label for="other">Other</label>
<br><br>

<label for="program">Program:</label>
<select id="program" name="program">
<option value="citcs">BS Computer Information Technology and Computer Science</option>
<option value="cs">BS Computer Science</option>
<option value="it">BS Information Technology</option>
<option value="ce">BS Computer Engineering</option>
</select>
<br><br>

<label>Hobbies:</label>
<input type="checkbox" id="programming" name="hobbies" value="programming">
<label for="programming">Programming</label>
<input type="checkbox" id="gaming" name="hobbies" value="gaming">
<label for="gaming">Gaming</label>
<input type="checkbox" id="reading" name="hobbies" value="reading">
<label for="reading">Reading</label>
<br><br>

<label for="address">Address:</label>
<input type="text" id="address" name="address" placeholder="Baguio City, Benguet">
<br><br>

<label for="comments">Comments:</label>
<br>
<textarea id="comments" name="comments" rows="4" cols="40" placeholder="Anything else you'd like to add?"></textarea>
<br><br>

<button type="submit">Submit</button>
<button type="reset">Reset</button>

</form>

</body>
</html>
